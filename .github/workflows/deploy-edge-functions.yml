name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # El chequeo va ANTES del deploy a propósito: si una función no compila o
      # quedó fuera de la lista de abajo, la publicación se frena en vez de
      # dejar producción a medias. Hasta el 2026-08-22 nada miraba estas
      # funciones — ni tsc (sólo cubre `src`), ni ESLint (las ignora), ni tests.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Edge Functions
        run: npm run check:functions

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy canonical Edge Functions
        run: |
          supabase functions deploy automated-backup --project-ref "$PROJECT_REF"
          supabase functions deploy check-consentimiento-pendientes --project-ref "$PROJECT_REF"
          supabase functions deploy generate-content --project-ref "$PROJECT_REF"
          supabase functions deploy health-check --project-ref "$PROJECT_REF"
          supabase functions deploy hermes-proxy --project-ref "$PROJECT_REF"
          supabase functions deploy ingest-moodle-grade-export --project-ref "$PROJECT_REF"
          supabase functions deploy ingest-moodle-grade-observation --project-ref "$PROJECT_REF"
          supabase functions deploy issue-moodle-signup-ticket --project-ref "$PROJECT_REF"
          supabase functions deploy launch-scheduler --project-ref "$PROJECT_REF"
          supabase functions deploy list-backups --project-ref "$PROJECT_REF"
          supabase functions deploy moodle-autologin --project-ref "$PROJECT_REF"
          supabase functions deploy request-password-reset --project-ref "$PROJECT_REF"
          supabase functions deploy register-moodle-student --project-ref "$PROJECT_REF"
          supabase functions deploy reset-password-with-token --project-ref "$PROJECT_REF"
          supabase functions deploy restore-backup --project-ref "$PROJECT_REF"
          supabase functions deploy send-consentimiento-final-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy send-email --project-ref "$PROJECT_REF"
          supabase functions deploy send-fcm-notification --project-ref "$PROJECT_REF"
          supabase functions deploy student-login --project-ref "$PROJECT_REF"
